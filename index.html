<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>홍길동</h1>
    <p class="tagline">새로운 것을 배우는 즐거움을 아는 사람입니다.</p>
  </header>

  <main>
    <section id="about">
      <h2>소개</h2>
      <p>안녕하세요, 홍길동입니다. 호기심이 많고 꾸준히 성장하는 것을 좋아합니다. 이 소개글은 임시 내용이니 자유롭게 수정해 주세요.</p>
    </section>

    <section id="favorites">
      <h2>좋아하는 것 3가지</h2>
      <ul class="cards">
        <li class="card">
          <span class="emoji">📚</span>
          <h3>독서</h3>
          <p>다양한 분야의 책을 읽으며 생각을 넓힙니다.</p>
        </li>
        <li class="card">
          <span class="emoji">🎵</span>
          <h3>음악</h3>
          <p>하루를 시작하고 마무리할 때 음악을 듣습니다.</p>
        </li>
        <li class="card">
          <span class="emoji">🥾</span>
          <h3>산책</h3>
          <p>가볍게 걸으며 머리를 식히는 시간을 좋아합니다.</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 홍길동. All rights reserved.</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
